<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Basketball Playtime Tracker</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f2f3f5}
*{box-sizing:border-box}body{margin:0;padding:10px}
.app{max-width:1100px;margin:auto}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:21px;margin:5px 0}.badge{font-weight:800;background:#111;color:#fff;padding:8px 12px;border-radius:10px}
.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin:10px 0}
.clock{text-align:center;font-size:54px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:800;min-height:44px}
.primary{background:#111;color:#fff}.danger{background:#fee2e2}.muted{background:#e5e7eb}
.small{font-size:13px;color:#666}
.nameinput{width:100%;border:0;background:transparent;font-size:17px;font-weight:800;outline:0;padding:3px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.player{border:1px solid #ddd;border-radius:12px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.player.running{outline:3px solid #111;background:#fafafa}.live{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
.actions{display:flex;gap:5px}.actions button{padding:9px 11px}.start{background:#111;color:#fff}.stop{background:#e5e7eb}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{border:1px solid #ddd;border-radius:10px;padding:9px;background:#fafafa}.stat b{display:block;font-size:18px;margin-top:2px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:7px;border-bottom:1px solid #eee;text-align:center}.table th:first-child,.table td:first-child{text-align:left}
canvas{width:100%;height:280px;border:1px solid #eee;border-radius:10px;background:#fff}
.hidden{display:none}
@media(max-width:650px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.clock{font-size:46px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>🏀 Basketball Playtime Tracker</h1><div class="badge" id="qLabel">Q1</div></div>

<div class="panel">
  <div class="clock" id="clock">10:00</div>
  <div class="small" style="text-align:center;margin:4px 0 10px">Basketball-Uhr · läuft rückwärts</div>
  <div class="controls">
    <button class="primary" id="gameStart">▶ START GAME</button>
    <button class="muted" id="gameStop">Ⅱ STOP GAME</button>
    <button class="muted" id="timeoutBtn">⏸ TIME OUT</button>
    <button class="danger" id="resetQ">RESET Q</button>
    <button class="muted" id="nextQ">NEXT QUARTER →</button>
    <button class="muted" id="newGame">NEUES SPIEL</button>
  </div>
</div>

<div class="summary" id="summary"></div>

<div class="panel">
  <div class="top"><strong>Spieler</strong><span class="small">Max. 4 Einsätze pro Viertel</span></div>
  <div class="grid" id="players"></div>
</div>

<div class="panel">
  <div class="top"><strong>Einsatzübersicht</strong><span class="small">Automatisch gespeichert während der Sitzung</span></div>
  <div class="tablewrap"><table class="table"><thead><tr><th>Spieler</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Total</th></tr></thead><tbody id="overview"></tbody></table></div>
</div>

<div class="panel">
  <div class="top"><strong>Verletzungszeit</strong><span class="small">Dauer eingeben, z. B. 2:59</span></div>
  <div class="grid" id="injury"></div>
</div>

<div class="panel">
  <div class="top"><strong>Spielzeit-Diagramm</strong><span class="small">Viertel auswählen</span></div>
  <div class="controls" id="chartButtons"></div>
  <canvas id="chart" width="1000" height="500"></canvas>
</div>
</div>

<script>
const DEFAULT_NAMES=["Spieler 1","Spieler 2","Spieler 3","Spieler 4","Spieler 5","Spieler 6","Spieler 7","Spieler 8","Spieler 9","Spieler 10","Spieler 11","Spieler 12"];
let names=[...DEFAULT_NAMES], q=1, clock=600, gameRunning=false, timeoutPaused=false, last=performance.now(), chartQ=1;
let data=Array.from({length:4},()=>names.map(()=>({runs:[],active:null,total:0})));
let injuries=[0,0,0,0];

const $=id=>document.getElementById(id);
function fmt(sec){sec=Math.max(0,Math.round(sec));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function mins(sec){return (sec/60).toFixed(2)+" min"}
function current(i,qq=q){let p=data[qq-1][i];return p.total+(p.active!==null?p.active-clock:0)}

function render(){
 $("qLabel").textContent="Q"+q;$("clock").textContent=fmt(clock);
 const arr=data[q-1];
 $("players").innerHTML=names.map((n,i)=>{
   const p=arr[i],t=current(i);
   return `<div class="player ${p.active!==null?"running":""}">
    <div>
      <input class="nameinput" data-name="${i}" value="${escapeHtml(n)}" aria-label="Spielername">
      <div class="small">${p.runs.length}/4 Einsätze · ${mins(t)}</div>
    </div>
    <div><div class="live">${fmt(t)}</div><div class="actions">
      <button class="start" data-start="${i}" ${p.active!==null||p.runs.length>=4?"disabled":""}>START</button>
      <button class="stop" data-stop="${i}" ${p.active===null?"disabled":""}>STOP</button>
    </div></div>
   </div>`;
 }).join("");
 document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startPlayer(+b.dataset.start));
 document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>stopPlayer(+b.dataset.stop));
 document.querySelectorAll("[data-name]").forEach(i=>i.addEventListener("change",e=>{names[+e.target.dataset.name]=e.target.value.trim()||DEFAULT_NAMES[+e.target.dataset.name];renderOverview();renderChart()}));
 renderOverview();
 renderInjury();
 renderChart();
}

function renderOverview(){
 $("overview").innerHTML=names.map((n,i)=>{
   const vals=[1,2,3,4].map(qq=>data[qq-1][i].total);
   const total=vals.reduce((a,b)=>a+b,0);
   return `<tr><td>${escapeHtml(n)}</td>${vals.map(v=>`<td>${mins(v)}</td>`).join("")}<td><b>${mins(total)}</b></td></tr>`;
 }).join("");
 const team=data[q-1].reduce((a,_,i)=>a+current(i),0);
 const total=data.reduce((sum,arr)=>sum+arr.reduce((a,p,i)=>a+p.total+(p.active!==null?(p.active-clock):0),0),0);
 $("summary").innerHTML=`<div class="stat">Spieluhr<b>${fmt(clock)}</b></div>
 <div class="stat">Aktiv<b>${data[q-1].filter(p=>p.active!==null).length}</b></div>
 <div class="stat">Q${q} Teamzeit<b>${mins(team)}</b></div>
 <div class="stat">Total Team<b>${mins(total)}</b></div>
 <div class="stat">Verletzung<b>${mins(injuries.reduce((a,b)=>a+b,0))}</b></div>`;
}

function renderInjury(){
 $("injury").innerHTML=[1,2,3,4].map(qq=>`<div><label class="small">Q${qq}</label><input id="inj${qq}" type="text" inputmode="decimal" placeholder="0:00" value="${fmt(injuries[qq-1])}" style="width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:16px"></div>`).join("");
 [1,2,3,4].forEach(qq=>{$("inj"+qq).onchange=e=>{injuries[qq-1]=parseDuration(e.target.value);renderOverview()}})
}
function parseDuration(s){if(!s)return 0;let a=s.split(":");if(a.length===2){let m=Number(a[0]),sec=Number(a[1]);if(Number.isFinite(m)&&Number.isFinite(sec))return Math.max(0,m*60+sec)}let n=Number(s.replace(",","."));return Number.isFinite(n)?Math.max(0,n*60):0}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function startPlayer(i){let p=data[q-1][i];if(p.active===null&&p.runs.length<4){p.active=clock;render()}}
function stopPlayer(i){let p=data[q-1][i];if(p.active!==null){p.total+=Math.max(0,p.active-clock);p.runs.push({start:p.active,end:clock,duration:Math.max(0,p.active-clock)});p.active=null;render()}}
function stopAll(){data[q-1].forEach((p,i)=>{if(p.active!==null)stopPlayer(i)})}

$("gameStart").onclick=()=>{if(clock>0){gameRunning=true;last=performance.now()}};
$("gameStop").onclick=()=>{gameRunning=false; timeoutPaused=false; $("timeoutBtn").textContent="⏸ TIME OUT";};
$("timeoutBtn").onclick=()=>{
  if(gameRunning){
    gameRunning=false;
    timeoutPaused=true;
    $("timeoutBtn").textContent="▶ RESUME GAME";
  } else if(timeoutPaused && clock>0){
    gameRunning=true;
    timeoutPaused=false;
    last=performance.now();
    $("timeoutBtn").textContent="⏸ TIME OUT";
  }
};
$("resetQ").onclick=()=>{gameRunning=false;data[q-1]=names.map(()=>({runs:[],active:null,total:0}));clock=600;render()};
$("newGame").onclick=()=>{if(confirm("Ganzes Spiel zurücksetzen?")){gameRunning=false;q=1;clock=600;data=Array.from({length:4},()=>names.map(()=>({runs:[],active:null,total:0})));injuries=[0,0,0,0];render()}};
$("nextQ").onclick=()=>{stopAll();gameRunning=false;if(q<4){q++;clock=600;render()}};

function renderChart(){
 const c=$("chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 ctx.font="bold 22px system-ui";ctx.fillText("Q"+chartQ+" – Einsatzphasen",20,30);
 const left=125,right=25,top=55,rowH=(h-top-25)/12,plotW=w-left-right;
 ctx.font="12px system-ui";
 for(let i=0;i<12;i++){
   const y=top+i*rowH+rowH/2, p=data[chartQ-1][i];
   ctx.fillStyle="#111";ctx.fillText(names[i],8,y+4);
   ctx.strokeStyle="#ddd";ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(left+plotW,y);ctx.stroke();
   p.runs.forEach(run=>{
     const x=left+(600-run.start)/600*plotW, ww=(run.start-run.end)/600*plotW;
     ctx.fillStyle="#111";ctx.fillRect(x,y-rowH*.28,Math.max(1,ww),rowH*.56);
     ctx.fillStyle="#fff";ctx.font="bold 11px system-ui";
     if(ww>35)ctx.fillText(fmt(run.duration),x+4,y+4);
   });
 }
 ctx.fillStyle="#555";ctx.font="11px system-ui";
 for(let m=0;m<=10;m+=2){let x=left+m/10*plotW;ctx.fillText(m+":00",x-10,h-5)}
}
[1,2,3,4].forEach(qq=>{let b=document.createElement("button");b.textContent="Q"+qq;b.className=qq===1?"primary":"muted";b.onclick=()=>{chartQ=qq;document.querySelectorAll("#chartButtons button").forEach(x=>x.className="muted");b.className="primary";renderChart()};$("chartButtons").appendChild(b)});

function loop(now){
 if(gameRunning){let d=(now-last)/1000;last=now;clock=Math.max(0,clock-d);if(clock<=0){clock=0;gameRunning=false;stopAll()}}
 else last=now;
 render();
 requestAnimationFrame(loop);
}
render();requestAnimationFrame(loop);
</script>
</body></html>
